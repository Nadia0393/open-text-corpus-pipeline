name: CI

   on:
     push:
     pull_request:

   jobs:
     test:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: "17"

         - uses: astral-sh/setup-uv@v5

         - name: Install dependencies
           run: uv sync --all-extras --dev

         - name: Lint
           run: uv run ruff check .

         - name: Test
           run: uv run pytest -q
